services:
  mysql:
    image: mysql:8.0
    container_name: local-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: nebula_ai
      MYSQL_DATABASE: nebula_ai
      MYSQL_USER: nebula_ai
      MYSQL_PASSWORD: nebula_ai
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
